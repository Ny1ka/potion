# XcodeGen spec for Potion (macOS). Generate the project with: make potion-macos-project
# The generated Potion.xcodeproj is not committed.
name: Potion
options:
  bundleIdPrefix: com.ny1ka
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: en
  # Readable by Xcode 15+ (local machine runs 15.4; CI runs newer).
  projectFormat: xcode15_0

packages:
  PotionCore:
    path: ../../core/swift

settings:
  base:
    MARKETING_VERSION: 0.9.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
    ENABLE_HARDENED_RUNTIME: YES
    # Local builds are ad-hoc signed. Developer ID signing is configured in M9 and
    # never uses credentials stored in this repo.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  Potion:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # Generated by the design system; referenced in place, never copied or edited.
      - path: ../../design-system/macos/Shared/PotionDesign.swift
        group: DesignSystem
      - path: ../../design-system/macos/Potion/Assets.xcassets
        group: DesignSystem
      - path: ../../design-system/fonts/SpaceGrotesk-Bold.ttf
        group: DesignSystem
        buildPhase: resources
      - path: ../../design-system/fonts/SpaceGrotesk-Medium.ttf
        group: DesignSystem
        buildPhase: resources
      # Shared About window and legal documents, plus the documents themselves (bundled, shown in the app).
      - path: ../shared/macos
        group: Shared
      - path: ../../legal/TERMS.md
        group: Legal
        buildPhase: resources
      - path: ../../legal/PRIVACY.md
        group: Legal
        buildPhase: resources
      - path: ../../legal/THIRD_PARTY_NOTICES.md
        group: Legal
        buildPhase: resources
      - path: ../../LICENSE
        group: Legal
        buildPhase: resources
      - path: Resources
    dependencies:
      - package: PotionCore
    postBuildScripts:
      # Copies the LGPL FFmpeg build (scripts/ffmpeg/) into Contents/Helpers and signs it. Debug builds
      # without it still run (audio and video then report the tools as missing); Release builds require it.
      - name: Bundle FFmpeg
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="${SRCROOT}/../../build/ffmpeg/macos/bin"
          DEST="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          if [ ! -x "$SRC/ffmpeg" ] || [ ! -x "$SRC/ffprobe" ]; then
            if [ "${CONFIGURATION}" = "Release" ]; then
              echo "error: FFmpeg build missing at $SRC. Run scripts/ffmpeg/build-macos.sh universal"; exit 1
            fi
            echo "warning: FFmpeg build missing at $SRC, so audio and video conversion won't work. Run scripts/ffmpeg/build-macos.sh"
            exit 0
          fi
          mkdir -p "$DEST"
          for tool in ffmpeg ffprobe; do
            ditto "$SRC/$tool" "$DEST/$tool"
            codesign --force --options runtime --timestamp=none --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$DEST/$tool"
          done
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Potion
        CFBundleName: Potion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2026 Nyika. MIT License."
        ATSApplicationFontsPath: "."
        # Finder › Services › Convert with Potion (an Action Extension for Quick Actions needs real signing, M9).
        NSServices:
          - NSMenuItem:
              default: Convert with Potion
            NSMessage: convertWithPotion
            NSPortName: Potion
            NSSendFileTypes:
              - public.item
            NSRequiredContext:
              NSApplicationIdentifier: com.apple.finder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ny1ka.potion
        PRODUCT_NAME: Potion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        # The FFmpeg bundling script reads build/ffmpeg outside the project folder.
        ENABLE_USER_SCRIPT_SANDBOXING: NO

schemes:
  Potion:
    build:
      targets:
        Potion: all
    run:
      config: Debug
    archive:
      config: Release
