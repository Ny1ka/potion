# XcodeGen spec for Potion Dropper (macOS). Generate the project with: make dropper-macos-project
# The generated "Potion Dropper.xcodeproj" is not committed.
name: Potion Dropper
options:
  bundleIdPrefix: com.ny1ka
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: en
  # Readable by Xcode 15+ (local machine runs 15.4; CI runs newer).
  projectFormat: xcode15_0

packages:
  PotionCore:
    path: ../../core/swift

settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
    ENABLE_HARDENED_RUNTIME: YES
    # Local builds are ad-hoc signed. Developer ID signing is configured in M9 and
    # never uses credentials stored in this repo.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  PotionDropper:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # Generated by the design system; referenced in place, never copied or edited.
      - path: ../../design-system/macos/Shared/PotionDesign.swift
        group: DesignSystem
      - path: ../../design-system/macos/PotionDropper/Assets.xcassets
        group: DesignSystem
      - path: ../../design-system/fonts/SpaceGrotesk-Bold.ttf
        group: DesignSystem
        buildPhase: resources
      - path: ../../design-system/fonts/SpaceGrotesk-Medium.ttf
        group: DesignSystem
        buildPhase: resources
      # Shared About window and legal documents, plus the documents themselves (bundled, shown in the app).
      - path: ../shared/macos
        group: Shared
      - path: ../../legal/TERMS.md
        group: Legal
        buildPhase: resources
      - path: ../../legal/PRIVACY.md
        group: Legal
        buildPhase: resources
      - path: ../../legal/THIRD_PARTY_NOTICES.md
        group: Legal
        buildPhase: resources
      - path: ../../LICENSE
        group: Legal
        buildPhase: resources
    dependencies:
      - package: PotionCore
    postBuildScripts:
      # Copies the LGPL FFmpeg build (scripts/ffmpeg/) into Contents/Helpers and signs it. Debug builds
      # without it still run (audio and video then report the tools as missing); Release builds require it.
      - name: Bundle FFmpeg
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="${SRCROOT}/../../build/ffmpeg/macos/bin"
          DEST="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          if [ ! -x "$SRC/ffmpeg" ] || [ ! -x "$SRC/ffprobe" ]; then
            if [ "${CONFIGURATION}" = "Release" ]; then
              echo "error: FFmpeg build missing at $SRC. Run scripts/ffmpeg/build-macos.sh universal"; exit 1
            fi
            echo "warning: FFmpeg build missing at $SRC, so audio and video conversion won't work. Run scripts/ffmpeg/build-macos.sh"
            exit 0
          fi
          mkdir -p "$DEST"
          for tool in ffmpeg ffprobe; do
            ditto "$SRC/$tool" "$DEST/$tool"
            codesign --force --options runtime --timestamp=none --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$DEST/$tool"
          done
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Potion Dropper
        CFBundleName: Potion Dropper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2026 Nyika. MIT License."
        ATSApplicationFontsPath: "."
        # Direct media links may be plain http://. The Downloader only fetches links the user entered (and the
        # redirects they lead to, re-checked against the allowlist), so App Transport Security can't decide this.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Services › Download with Potion Dropper, for a link selected in any app.
        NSServices:
          - NSMenuItem:
              default: Download with Potion Dropper
            NSMessage: downloadWithPotionDropper
            NSPortName: Potion Dropper
            NSSendTypes:
              - public.url
              - public.utf8-plain-text
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ny1ka.potion-dropper
        PRODUCT_NAME: Potion Dropper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        # The FFmpeg bundling script reads build/ffmpeg outside the project folder.
        ENABLE_USER_SCRIPT_SANDBOXING: NO

schemes:
  PotionDropper:
    build:
      targets:
        PotionDropper: all
    run:
      config: Debug
    archive:
      config: Release
