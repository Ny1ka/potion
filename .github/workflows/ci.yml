# Builds and tests all apps on every push and pull request, and scans sources and
# built apps for content blocked by the source policy (CLAUDE.md › Source policy).
# Job names are stable on purpose: branch rulesets reference them as required checks.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  scan:
    name: Source scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked files
        run: scripts/forbidden-scan.sh --tree
      - name: Third-party notices are complete and current
        run: |
          python3 scripts/legal/notices.py check
          python3 scripts/legal/notices.py check-ffmpeg
      - name: Swift copies of core/spec are in sync
        run: scripts/sync-spec.sh --check

  macos:
    name: macOS build + tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: brew install xcodegen nasm cmake
      # The LGPL FFmpeg build takes a while, so it is cached until scripts/ffmpeg/ changes.
      - name: Restore FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: build/ffmpeg/macos
          key: ffmpeg-macos-${{ hashFiles('scripts/ffmpeg/versions.sh', 'scripts/ffmpeg/build-macos.sh') }}
      - name: Build FFmpeg (LGPL, universal)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: scripts/ffmpeg/build-macos.sh universal
      - name: Verify FFmpeg license
        run: scripts/ffmpeg/verify-license.sh build/ffmpeg/macos/bin
      - name: PotionCore tests (including engine tests with the FFmpeg build)
        run: |
          set -o pipefail
          swift test --package-path core/swift 2>&1 | tee swift-test.log
        env:
          POTION_REQUIRE_FFMPEG: "1"
      # Compile errors and failed assertions become annotations, visible on the run page and through the public API.
      - name: Report failed Swift tests
        if: failure()
        run: |
          grep -E "(error|fatal error):|Test Case .* failed|Exited with|signal code" swift-test.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::error title=swift test::${line:0:900}"
          done
      - name: Generate Xcode project
        run: cd apps/potion-macos && xcodegen generate --quiet
      - name: Build Potion (Debug)
        run: >
          xcodebuild -project apps/potion-macos/Potion.xcodeproj -scheme Potion
          -configuration Debug -derivedDataPath build/DerivedData -quiet build
      - name: Build Potion (Release)
        run: >
          xcodebuild -project apps/potion-macos/Potion.xcodeproj -scheme Potion
          -configuration Release -derivedDataPath build/DerivedData -quiet build
      - name: Scan Release app
        run: scripts/forbidden-scan.sh --artifact build/DerivedData/Build/Products/Release/Potion.app
      - name: Generate Potion Dropper Xcode project
        run: cd apps/dropper-macos && xcodegen generate --quiet
      - name: Build Potion Dropper (Debug)
        run: >
          xcodebuild -project "apps/dropper-macos/Potion Dropper.xcodeproj" -scheme PotionDropper
          -configuration Debug -derivedDataPath build/DerivedData -quiet build
      - name: Build Potion Dropper (Release)
        run: >
          xcodebuild -project "apps/dropper-macos/Potion Dropper.xcodeproj" -scheme PotionDropper
          -configuration Release -derivedDataPath build/DerivedData -quiet build
      - name: Scan Potion Dropper Release app
        run: scripts/forbidden-scan.sh --artifact "build/DerivedData/Build/Products/Release/Potion Dropper.app"

  # Cross-compiles the LGPL FFmpeg for Windows with MinGW-w64 (much faster than building on Windows) and
  # caches it for the Windows job, which runs the full license check on the real .exe files.
  ffmpeg-windows:
    name: Windows FFmpeg build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: build/ffmpeg/windows
          key: ffmpeg-windows-${{ hashFiles('scripts/ffmpeg/versions.sh', 'scripts/ffmpeg/build-windows.sh') }}
          enableCrossOsArchive: true
      - name: Install MinGW-w64 and build tools
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q mingw-w64 nasm cmake pkg-config
      - name: Build FFmpeg (LGPL, x86_64)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: scripts/ffmpeg/build-windows.sh

  windows:
    name: Windows build + tests
    runs-on: windows-latest
    needs: ffmpeg-windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore FFmpeg build
        uses: actions/cache/restore@v6
        with:
          path: build/ffmpeg/windows
          key: ffmpeg-windows-${{ hashFiles('scripts/ffmpeg/versions.sh', 'scripts/ffmpeg/build-windows.sh') }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Verify FFmpeg license (runs the .exe)
        shell: bash
        run: scripts/ffmpeg/verify-license.sh build/ffmpeg/windows/bin
      - name: Potion.Core tests (including engine tests with the FFmpeg build)
        run: dotnet test core/dotnet/Potion.Core.Tests --logger trx --results-directory TestResults
        env:
          POTION_REQUIRE_FFMPEG: "1"
      - name: Potion.Core.Windows tests (WIC imaging)
        run: dotnet test core/dotnet/Potion.Core.Windows.Tests --logger trx --results-directory TestResults
        env:
          POTION_REQUIRE_FFMPEG: "1"
      # Failed tests become annotations, which are visible on the run page and through the public API.
      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem TestResults -Recurse -Filter *.trx -ErrorAction SilentlyContinue | ForEach-Object {
            [xml]$trx = Get-Content $_.FullName
            $trx.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' } | ForEach-Object {
              $message = ($_.Output.ErrorInfo.Message + ' ' + $_.Output.ErrorInfo.StackTrace) -replace "`r?`n", ' '
              Write-Output "::error title=$($_.testName)::$($message.Substring(0, [Math]::Min(900, $message.Length)))"
            }
          }
      - name: Build Potion (Debug)
        shell: bash
        run: |
          set -o pipefail
          dotnet build apps/potion-windows/Potion/Potion.csproj -c Debug -p:Platform=x64 2>&1 | tee -a build-windows.log
      - name: Build Potion (Release)
        shell: bash
        run: |
          set -o pipefail
          dotnet build apps/potion-windows/Potion/Potion.csproj -c Release -p:Platform=x64 2>&1 | tee -a build-windows.log
      - name: Scan Release app
        shell: bash
        run: scripts/forbidden-scan.sh --artifact apps/potion-windows/Potion/bin/x64/Release
      - name: Build Potion Dropper (Debug)
        shell: bash
        run: |
          set -o pipefail
          dotnet build apps/dropper-windows/PotionDropper/PotionDropper.csproj -c Debug -p:Platform=x64 2>&1 | tee -a build-windows.log
      - name: Build Potion Dropper (Release)
        shell: bash
        run: |
          set -o pipefail
          dotnet build apps/dropper-windows/PotionDropper/PotionDropper.csproj -c Release -p:Platform=x64 2>&1 | tee -a build-windows.log
      - name: Scan Potion Dropper Release app
        shell: bash
        run: scripts/forbidden-scan.sh --artifact apps/dropper-windows/PotionDropper/bin/x64/Release
      - name: Every shipped .NET package is in the third-party notices
        shell: bash
        run: |
          mapfile -t files < <(find apps/potion-windows/Potion/bin/x64/Release apps/dropper-windows/PotionDropper/bin/x64/Release \
            \( -name Potion.deps.json -o -name PotionDropper.deps.json \) -type f)
          echo "Checking: ${files[*]}"
          [ ${#files[@]} -ge 2 ] || { echo "::error title=third-party notices::Release deps.json files not found"; exit 1; }
          python scripts/legal/notices.py check-packages "${files[@]}"
      # XAML compiler errors don't match the .NET problem matcher, so build errors are re-reported as annotations.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          [ -f build-windows.log ] || exit 0
          { grep -E "error [A-Z]+[0-9]+|: error |XamlCompiler error" build-windows.log || true; } | sort -u | head -40 | while IFS= read -r line; do
            echo "::error title=build::${line:0:900}"
          done
